name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Cancel in-progress runs for the same branch on new pushes
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Web: Type Check ─────────────────────────────────────────────────────
  web-type-check:
    name: Web Type Check
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version to')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run vue-tsc
        run: npm --workspace apps/web run type-check

  # ── Web: Lint ───────────────────────────────────────────────────────────
  web-lint:
    name: Web Lint
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version to')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm --workspace apps/web run lint

  # ── Web: Unit Tests ─────────────────────────────────────────────────────
  web-test:
    name: Web Unit Tests
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version to')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm --workspace apps/web run test:run

      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage
          path: apps/web/coverage/
          retention-days: 7

  # ── Web: Build ──────────────────────────────────────────────────────────
  # Validates the production build succeeds. This catches vite config errors
  # and missing env vars that type-check alone won't catch.
  web-build:
    name: Web Build
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version to')
    runs-on: ubuntu-latest
    needs: [web-type-check, web-lint, web-test]
    env:
      # Use empty stubs for build-time env vars — real values are on Vercel
      VITE_FIREBASE_API_KEY: stub
      VITE_FIREBASE_AUTH_DOMAIN: stub.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: stub
      VITE_FIREBASE_STORAGE_BUCKET: stub.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:stub"
      VITE_POSTHOG_KEY: ""
      VITE_MAPBOX_TOKEN: ""
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm --workspace apps/web run build-only

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: apps/web/dist/
          retention-days: 3

  # ── Functions: Type Check ───────────────────────────────────────────────
  functions-type-check:
    name: Functions Type Check
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version to')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check functions
        run: npm --workspace apps/firebase-functions run type-check

  # ── Functions: Lint ─────────────────────────────────────────────────────
  functions-lint:
    name: Functions Lint
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version to')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm --workspace apps/firebase-functions run lint

  # ── Functions: Unit Tests ───────────────────────────────────────────────
  functions-test:
    name: Functions Unit Tests
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version to')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm --workspace apps/firebase-functions run test
